<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Phoneix</title>
<style>
  :root {
    --bg: #0d0d12; --card: #17171f; --line: #26262f; --text: #f3f3f7; --dim: #9a9aa8;
    --a1: #ff5e96; --a2: #8a5cf6; --ok: #3ddc97; --warn: #ffb454;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; }
  body { overflow-y: auto; }
  main { max-width: 460px; margin: 0 auto; padding: 22px 20px 28px; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .logo { width: 44px; height: 44px; border-radius: 13px; background: linear-gradient(135deg, var(--a1), var(--a2)); display: grid; place-items: center; }
  .logo i { width: 16px; height: 26px; border: 3px solid #fff; border-radius: 5px; position: relative; display: block; }
  .logo i::after { content: ""; position: absolute; top: 3px; right: 2px; width: 4px; height: 4px; border-radius: 50%; background: #fff; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  header p { margin: 0; color: var(--dim); font-size: 12.5px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .card h2 { font-size: 11px; font-weight: 600; letter-spacing: .9px; text-transform: uppercase; color: var(--dim); margin: 0 0 12px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 4px rgba(61,220,151,.16); }
  .dot.warn { background: var(--warn); }
  .grow { flex: 1; min-width: 0; }
  .big { font-size: 17px; font-weight: 600; }
  .dim { color: var(--dim); font-size: 12.5px; }
  .ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  button { font: inherit; color: var(--text); background: #22222c; border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; cursor: pointer; transition: background .15s, transform .08s; }
  button:hover { background: #2a2a36; }
  button:active { transform: scale(.97); }
  button.primary { background: linear-gradient(135deg, var(--a1), var(--a2)); border-color: transparent; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  button.danger { color: #ff8a8a; }
  button:disabled { opacity: .45; cursor: default; }
  .qrwrap { background: #fff; border-radius: 14px; padding: 8px; width: 232px; height: 232px; margin: 4px auto 14px; }
  .qrwrap svg { width: 100%; height: 100%; display: block; }
  ol { margin: 0 0 4px; padding-left: 20px; color: var(--dim); font-size: 13px; }
  ol li { margin: 3px 0; }
  .center { text-align: center; }
  .empty { text-align: center; padding: 6px 0 2px; }
  .phone { width: 54px; height: 54px; border-radius: 16px; margin: 0 auto 10px; background: #1f1f29; display: grid; place-items: center; }
  .phone i { width: 18px; height: 30px; border: 3px solid var(--dim); border-radius: 6px; display: block; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  li.act { display: flex; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }
  li.act:first-child { border-top: 0; padding-top: 0; }
  li.act time { color: var(--dim); font-size: 12px; flex: none; width: 54px; }
  li.act span { min-width: 0; overflow-wrap: anywhere; }
  label.sw { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
  label.sw input { appearance: none; width: 38px; height: 22px; border-radius: 11px; background: #2c2c38; position: relative; transition: background .2s; flex: none; cursor: pointer; }
  label.sw input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s; }
  label.sw input:checked { background: linear-gradient(135deg, var(--a1), var(--a2)); }
  label.sw input:checked::after { transform: translateX(16px); }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 20px); opacity: 0; background: #2b2b38; border: 1px solid var(--line); padding: 8px 14px; border-radius: 10px; transition: .25s; pointer-events: none; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <div class="logo"><i></i></div>
    <div><h1>Phoneix</h1><p>Telefonun, bilgisayarında.</p></div>
  </header>

  <section class="card" id="conn">
    <h2>Telefon</h2>
    <div id="unpaired" class="empty" hidden>
      <div class="phone"><i></i></div>
      <div class="big">Telefon eşleşmedi</div>
      <div class="dim" style="margin-top:4px">Android'de Phoneix uygulamasını aç, sonra buradan kodu çıkar.</div>
      <div class="btns" style="justify-content:center"><button class="primary" id="pair">Telefonu eşleştir</button></div>
    </div>
    <div id="pairing" hidden>
      <div class="qrwrap" id="qr"></div>
      <ol>
        <li>Telefonda Phoneix'i aç</li>
        <li><b>"QR ile eşleştir"</b>e bas</li>
        <li>Bu kodu okut, çıkan soruda <b>Eşleş</b>'e bas</li>
      </ol>
      <div class="dim center" id="addr" style="margin-top:8px"></div>
      <div class="btns" style="justify-content:center"><button id="cancel">Vazgeç</button></div>
    </div>
    <div id="paired" hidden>
      <div class="row">
        <span class="dot" id="pdot"></span>
        <div class="grow"><div class="big ell" id="pname"></div><div class="dim" id="pseen"></div></div>
      </div>
      <div class="btns">
        <button class="primary" id="test">Test bildirimi</button>
        <button id="repair">Yeniden eşleştir</button>
        <button class="danger" id="unpair">Kaldır</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>Dynamic Bar</h2>
    <div class="row">
      <span class="dot" id="ddot"></span>
      <div class="grow"><div id="dtitle" class="big" style="font-size:15px"></div><div class="dim" id="dsub"></div></div>
    </div>
  </section>

  <section class="card">
    <h2>Etkinlik</h2>
    <ul id="acts"></ul>
    <div class="dim" id="noact">Henüz bir şey olmadı.</div>
  </section>

  <section class="card">
    <label class="sw"><div><div>Windows açılınca başlat</div><div class="dim">Tepsiye küçülür, pencere açılmaz.</div></div><input type="checkbox" id="auto"></label>
    <div class="dim" id="net" style="margin-top:12px"></div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let st = null, showQr = false;
  const toast = (t) => { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2200); };
  const ago = (t) => {
    if (!t) return 'henüz mesaj yok';
    const s = Math.max(0, Math.round((Date.now() - t) / 1000));
    if (s < 10) return 'az önce'; if (s < 60) return s + ' sn önce'; if (s < 3600) return Math.floor(s / 60) + ' dk önce';
    if (s < 86400) return Math.floor(s / 3600) + ' sa önce'; return Math.floor(s / 86400) + ' gün önce';
  };

  function render() {
    if (!st) return;
    const pairing = showQr && st.pairing;
    $('unpaired').hidden = st.paired || pairing;
    $('pairing').hidden = !pairing;
    $('paired').hidden = !st.paired || pairing;
    if (!pairing && showQr) showQr = false;
    $('pname').textContent = st.name || 'Telefon';
    const recent = st.lastMsg && Date.now() - st.lastMsg < 120000;
    $('pdot').className = 'dot' + (recent ? ' ok' : '');
    $('pseen').textContent = 'Son mesaj: ' + ago(st.lastMsg);
    $('ddot').className = 'dot ' + (st.dynbar ? 'ok' : 'warn');
    $('dtitle').textContent = st.dynbar ? 'Dynamic Bar bulundu' : 'Dynamic Bar çalışmıyor';
    $('dsub').textContent = st.dynbar ? 'Telefon bildirimleri adada görünür.' : 'Bildirimler yerine Windows bildirimi gösterilir.';
    $('auto').checked = !!st.autostart;
    $('net').textContent = st.listening ? 'Dinleniyor: ' + (st.ips.join(', ') || 'ağ adresi yok') + ' · bağlantı noktası ' + st.port : 'Eşleşme yokken dinlenmez.';
    const ul = $('acts'); ul.textContent = '';
    st.activity.forEach((a) => {
      const li = document.createElement('li'); li.className = 'act';
      const t = document.createElement('time'); t.textContent = ago(a.t);
      const s = document.createElement('span'); s.textContent = a.text;
      li.append(t, s); ul.append(li);
    });
    $('noact').hidden = st.activity.length > 0;
  }

  async function startPair() {
    $('qr').textContent = '';
    showQr = true;
    const r = await phoneix.pair();
    if (!r) { showQr = false; toast('Eşleştirme başlatılamadı'); return; }
    $('qr').innerHTML = r.svg; // svg kendi sunucumuzdan geliyor
    $('addr').textContent = (r.ips.join(', ') || 'ağ adresi bulunamadı') + ' · ' + r.port;
    st = await phoneix.state(); render();
  }

  $('pair').onclick = startPair;
  $('repair').onclick = startPair;
  $('cancel').onclick = async () => { showQr = false; phoneix.cancel(); st = await phoneix.state(); render(); };
  $('unpair').onclick = () => { phoneix.unpair(); toast('Eşleştirme kaldırıldı'); };
  $('test').onclick = async () => { const via = await phoneix.test(); toast(via === 'bar' ? 'Dynamic Bar\'a gönderildi' : 'Windows bildirimi gösterildi'); };
  $('auto').onchange = (e) => phoneix.autostart(e.target.checked);
  phoneix.onState((s) => { st = s; render(); });
  phoneix.onPaired(() => { showQr = false; toast('Telefon eşleşti 🎉'); });
  phoneix.state().then((s) => { st = s; render(); });
  setInterval(render, 15000);
})();
</script>
</body>
</html>
